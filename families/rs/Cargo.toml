[package]
name = "jmark-rs"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "runner"
path = "runner.rs"

[dependencies]
isahc = "2.0.2"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rustls = "0.23.46"
ureq = "3.5.2"

[profile.release]
debug = false
